<!--
  Passcode email for Case Access verification.

  Deliberately a code and not a clickable link. A link in a mailbox is a bearer credential: it
  survives forwarding, shared inboxes, and mail scanners that follow URLs. A code has to be read
  by a person and typed back into the session that requested it, which is what makes possession
  of a forwarded invitation insufficient on its own (design.md D5).

  {{ .Token }} is the only dynamic value. No case, client, or organization detail appears here —
  this message goes to an address that has not yet proven anything.
-->
<h2>Tu código de acceso</h2>

<p>Usa este código para continuar:</p>

<p style="font-size: 28px; font-weight: 600; letter-spacing: 4px; font-family: monospace;">
  {{ .Token }}
</p>

<p>El código vence en cinco minutos. Si no lo solicitaste, puedes ignorar este mensaje.</p>
